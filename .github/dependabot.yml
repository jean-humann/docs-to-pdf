version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: daily
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    open-pull-requests-limit: 15
    exclude-paths:
      - 'tests/website/**'
    ignore:
      # chalk v5+ is ESM-only; this package builds to CommonJS, so a major bump
      # breaks CJS consumers with ERR_REQUIRE_ESM (see #562). Stay on v4.
      - dependency-name: 'chalk'
        update-type: 'version-update:semver-major'
      # commitlint v21+ requires Node >= 22.12 and drops Node 20, which this
      # project still supports (engines: >=20, CI tests 20.x). Stay on v20.
      - dependency-name: 'commitlint'
        update-type: 'version-update:semver-major'
      - dependency-name: '@commitlint/*'
        update-type: 'version-update:semver-major'
    groups:
      puppeteer:
        patterns:
          - 'puppeteer*'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: daily
    commit-message:
      prefix: ci
      include: scope
    open-pull-requests-limit: 10
    exclude-paths:
      - '.github/workflows/claude*.yml'
  - package-ecosystem: docker
    directory: '/docker/'
    schedule:
      interval: daily
    commit-message:
      prefix: ci
      include: scope
    open-pull-requests-limit: 10
