# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Publish

on:
  release:
    types: [published]
  # Allow re-publishing the current version manually (e.g. if a release-time
  # publish failed). Publishes whatever version is in package.json on the ref.
  workflow_dispatch:

jobs:
  publish-npm:
    name: Publish npm packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for npm Trusted Publishing + provenance
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - name: Install dependencies
        run: yarn
      - name: Build packages
        run: yarn build
      # npm Trusted Publishing (OIDC) requires npm >= 11.5.1; node 22 ships npm 10.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest
      - name: Publish packages
        # Authentication is via the GitHub OIDC token + the npm Trusted Publisher
        # configured for this repo/workflow - no NPM_TOKEN needed. --provenance
        # generates a signed attestation linking the package to this repo + commit.
        run: npm publish --provenance --access public
  publish-docker:
    name: Publish docker images
    # Only on real releases; manual workflow_dispatch re-publishes npm only.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install dependencies
        run: yarn
      - name: Build packages
        run: yarn build
      - name: Pack packages for docker
        run: docker/pack.sh ${{ matrix.os }}
      - name: Login to GitHub Packages
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},suffix=-node${{ matrix.node-version }}-${{ matrix.os }}
            type=semver,pattern={{major}}.{{minor}},suffix=-node${{ matrix.node-version }}-${{ matrix.os }}
            type=raw,value=latest-node${{ matrix.node-version }}-${{ matrix.os }}
      - name: Publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./docker/${{ matrix.os }}
          push: true
          build-args: |
            NODE_VERSION=${{ matrix.node-version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
    strategy:
      matrix:
        os:
          - alpine
          - debian
        node-version:
          - 20
          - 22
          - 24
